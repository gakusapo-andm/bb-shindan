<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ========================================
// トースト通知システム
// ========================================
const ToastContext = React.createContext(null);

const ToastProvider = ({ children }) => {
  const [toasts, setToasts] = useState([]);
  const idRef = useRef(0);
  const addToast = useCallback((message, type = 'success', duration = 2800) => {
    const id = ++idRef.current;
    setToasts(prev => [...prev, { id, message, type, duration }]);
  }, []);
  const removeToast = useCallback((id) => setToasts(prev => prev.filter(t => t.id !== id)), []);
  return (
    <ToastContext.Provider value={addToast}>
      {children}
      <div style={{ position:'fixed', bottom:'24px', left:'50%', transform:'translateX(-50%)', zIndex:9998, display:'flex', flexDirection:'column', gap:'8px', alignItems:'center', pointerEvents:'none' }}>
        {toasts.map(t => <ToastItem key={t.id} toast={t} onDone={() => removeToast(t.id)} />)}
      </div>
    </ToastContext.Provider>
  );
};

const ToastItem = ({ toast, onDone }) => {
  const [exiting, setExiting] = useState(false);
  useEffect(() => { const t = setTimeout(() => setExiting(true), toast.duration || 2800); return () => clearTimeout(t); }, []);
  useEffect(() => { if (exiting) { const t = setTimeout(onDone, 300); return () => clearTimeout(t); } }, [exiting]);
  const colors = { success: '#14181F', error: '#B93E0B', info: '#14181F', warning: '#8A5A00' };
  const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
  return (
    <div className={exiting ? 'toast-exit' : 'toast-enter'} style={{ pointerEvents:'auto', padding:'12px 20px', borderRadius:'12px', boxShadow:'0 10px 40px rgba(0,0,0,0.2)', display:'flex', alignItems:'center', gap:'10px', fontSize:'14px', fontWeight:500, color:'#fff', background: colors[toast.type] || colors.info }}>
      <span style={{ width:'24px', height:'24px', borderRadius:'50%', background:'rgba(255,255,255,0.2)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'11px', fontWeight:700, flexShrink:0 }}>{icons[toast.type] || 'ℹ'}</span>
      {toast.message}
    </div>
  );
};

const useToast = () => {
  const ctx = React.useContext(ToastContext);
  return ctx || ((msg) => { console.log('[Toast]', msg); });
};

// 定数

// v3: ステップ定義（role/sizeに応じて動的生成）
// 【設計意図】
// 担当者と上層部で完全に異なるフローを提供する。
// 担当者: 企業規模→職種→ターゲット→手法→課題→問診→ファネル の7ステップ（size指定済みなら6）
// 上層部: 問診のみ1ステップ（担当者が入力した前提データは共有、上層部自身の回答のみ収集）
// この分離により:
//  - 上層部の負担を最小化（10-15分で完了）
//  - 担当者と上層部の回答を独立収集 → BB診断で「認識ギャップ」を可視化
const STEP_DEFS = {
  companySize: { id: 'companySize', label: '企業規模', icon: 'building' },
  jobType: { id: 'jobType', label: '採用職種', icon: 'briefcase' },
  target: { id: 'target', label: 'ターゲット層', icon: 'graduationCap' },
  method: { id: 'method', label: '採用手法', icon: 'signal' },
  challenges: { id: 'challenges', label: '課題・挑戦', icon: 'lightBulb' },
  staff: { id: 'staff', label: '担当者問診', icon: 'user' },
  executive: { id: 'executive', label: '上層部問診', icon: 'tie' },
  funnel: { id: 'funnel', label: 'ファネル数値', icon: 'chartBar' },
};

function buildSteps(role, hasUrlSize) {
  let steps;
  if (role === 'exec') {
    steps = [STEP_DEFS.executive];
  } else {
    steps = [];
    if (!hasUrlSize) steps.push(STEP_DEFS.companySize);
    steps.push(STEP_DEFS.jobType, STEP_DEFS.target, STEP_DEFS.method);
    steps.push(STEP_DEFS.challenges);
    steps.push(STEP_DEFS.funnel, STEP_DEFS.staff); // v3.7: ファネル数値を先に・担当者問診を最後に
  }
  return steps.map((s, i) => ({ ...s, num: i + 1 }));
}

// 事前問診はBB診断のSupabase anonKeyを共有して直接クエリする。
// GASを経由しない。これにより:
//  - 顧客がログイン不要（anon RLSポリシーで制御）
//  - BB診断と同じDBを参照するので問診マスター/採用手法マスターが常に最新
//  - レイテンシが低い（GAS経由のコールドスタート問題を回避）
// トレードオフ: anonKeyがフロントに露出するが、RLSで書き込み範囲を制限。

// Supabase準備待機ヘルパー
async function ensureSupabase() {
  for (let i = 0; i < 50; i++) {
    if (window._supabase) return window._supabase;
    await new Promise(r => setTimeout(r, 100));
  }
  throw new Error('Supabase未初期化（5秒タイムアウト）');
}

const gasGet = async (action, params = {}) => {
  try {
    const sb = await ensureSupabase();
    console.log('[API GET] ' + action + ' Supabaseクエリ送信...');
    
    const handlers = {
      ping: async () => ({ success: true, message: 'pong (Supabase)' }),
      
      getCustomerPreInput: async () => {
        // v3.3(2026-08-11): テーブル直readを廃止しRPC化。
        // 症状: pre_inputs_select_anon が USING(true) のため、anon keyだけで
        //       全社の事前問診回答(229件)が読める状態だった。
        // 根因: anonにテーブル直アクセスを開くと、条件はフロント指定＝改変可能。
        // 予防: get_pre_input RPC(SECURITY DEFINER)経由に統一し、
        //       customer_id 1件分の input_data のみ返す。anonポリシーは削除。
        // v3.5(2026-09-25): get_pre_input は token を確かめないため（問診番号だけで他社分が読める）、
        //       token 必須の preinput_get に置き換え（DBパッチ07）。
        const id = params.id;
        if (!id) return { success: false, error: 'IDがありません' };
        // v3.3: token 必須の関数で読む（照合はDB側）
        const { data, error } = await sb.rpc('preinput_get', { p_id: id, p_token: window.GAS_CONFIG.token || '' });
        if (error) {
          if (String(error.message || '').includes('invalid_token')) return { success: false, error: 'invalid_token' };
          throw error;
        }
        return { success: true, data: data || null };
      },
      
      // v3.7: BB診断に取り込み済みか（取り込んだ後は見るだけ）。関数が無い環境では「未取込」扱い
      getPreInputStatus: async () => {
        const id = params.id;
        if (!id) return { success: true, data: { importedAt: null } };
        const { data, error } = await sb.rpc('preinput_status', { p_id: id, p_token: window.GAS_CONFIG.token || '', p_role: params.role || 'staff' });
        if (error) {
          const msg = String(error.message || '') + ' ' + String(error.code || '');
          if (/PGRST202|42883|Could not find the function|does not exist/i.test(msg)) return { success: true, data: { importedAt: null, lastSubmitAt: null } };
          throw error;
        }
        return { success: true, data: { importedAt: (data && data.importedAt) || null, lastSubmitAt: (data && data.lastSubmitAt) || null } };
      },

      // v3.6: その診断の版の質問（BB診断の写し）。token の照合は DB の関数の中で行う
      getQuestionMasterForPreInput: async () => {
        const id = params.id;
        if (id) {
          const { data, error } = await sb.rpc('preinput_question_master', { p_id: id, p_token: window.GAS_CONFIG.token || '' });
          if (!error && data && typeof data === 'object' && data.base) {
            const hasAny = Object.values(data.base).some(sz => sz && typeof sz === 'object'
              && Object.values(sz).some(a => Array.isArray(a) && a.length > 0));
            if (hasAny) {
              if (!data.recruitmentMethod) data.recruitmentMethod = {};
              console.log('[事前問診 v3.6] 診断の版の質問を使用');
              return { success: true, data, source: 'snapshot' };
            }
          }
          if (error) {
            const msg = String(error.message || '') + ' ' + String(error.code || '');
            if (msg.includes('invalid_token')) return { success: false, error: 'invalid_token' };
            if (!/PGRST202|42883|Could not find the function|does not exist/i.test(msg)) throw error;
            console.warn('[事前問診 v3.6] preinput_question_master が未作成のため最新の質問を使用（DBパッチ13 適用前）');
          }
        }
        // 写しが無い／関数が無い → 従来どおり最新
        return handlers.getQuestionMasterPublic();
      },

      getQuestionMasterPublic: async () => {
        const { data, error } = await sb.from('questions').select('*').order('sort_order');
        if (error) throw error;
        const rows = data || [];
        if (rows.length === 0) return { success: true, data: null };
        // v50同等: フラット行 → ネスト構造に変換
        const nested = { base: {}, recruitmentMethod: {}, industry: {}, targetLayer: {}, depth: {} };
        rows.forEach(row => {
          const qObj = {
            id: row.question_id || '', question: row.question_text || '',
            choiceA: row.choice_a || '', choiceB: row.choice_b || '',
            studentQuestion: row.student_question || '',
            studentChoiceA: row.student_choice_a || '', studentChoiceB: row.student_choice_b || '',
            correctAnswer: row.correct_answer || 'A', points: row.points || 2,
            axisType: row.axis_type || '', axisKey: row.axis_key || '',
            gapCheck: row.gap_check || false, depthKey: row.depth_phase || null,
            newGradText: (row.newgrad_text && typeof row.newgrad_text === 'object') ? row.newgrad_text : null // v4.0
          };
          const section = row.section || 'base';
          const role = row.role || 'staff';
          if (section === 'base') {
            const size = row.company_size || 'small';
            if (!nested.base[size]) nested.base[size] = {};
            if (!nested.base[size][role]) nested.base[size][role] = [];
            nested.base[size][role].push(qObj);
          } else if (section === 'recruitmentMethod') {
            const cat = row.method_category || '';
            if (!nested.recruitmentMethod[cat]) nested.recruitmentMethod[cat] = {};
            if (!nested.recruitmentMethod[cat][role]) nested.recruitmentMethod[cat][role] = [];
            nested.recruitmentMethod[cat][role].push(qObj);
          } else if (section === 'industry') {
            const ind = row.industry || '';
            const sz = row.company_size || 'small';
            if (!nested.industry[ind]) nested.industry[ind] = {};
            if (!nested.industry[ind][sz]) nested.industry[ind][sz] = {};
            if (!nested.industry[ind][sz][role]) nested.industry[ind][sz][role] = [];
            nested.industry[ind][sz][role].push(qObj);
          } else if (section === 'targetLayer') {
            const layer = row.target_layer || '';
            if (!nested.targetLayer[layer]) nested.targetLayer[layer] = {};
            if (!nested.targetLayer[layer][role]) nested.targetLayer[layer][role] = [];
            nested.targetLayer[layer][role].push(qObj);
          } else if (section === 'depth') {
            const phase = row.depth_phase || '';
            if (!nested.depth[phase]) nested.depth[phase] = {};
            if (!nested.depth[phase][role]) nested.depth[phase][role] = [];
            nested.depth[phase][role].push(qObj);
          }
        });
        return { success: true, data: nested };
      },
      
      getRecruitmentMethodsPublic: async () => {
        const { data, error } = await sb.from('recruitment_methods').select('*');
        if (error) throw error;
        const rows = data || [];
        if (rows.length === 0) return { success: true, data: {} };
        // v50同等: フラット行 → { key: { name, category, ... } } に変換
        const nested = {};
        rows.forEach(row => {
          const key = row.key || '';
          if (!key) return;
          let targetLayers = row.target_layers;
          if (typeof targetLayers === 'string') {
            try { targetLayers = JSON.parse(targetLayers); } catch(e) { targetLayers = []; }
          }
          nested[key] = {
            name: row.name || '', category: row.category || '',
            targetLayers: Array.isArray(targetLayers) ? targetLayers : [],
            description: row.description || '',
            phaseMapping: {
              surface: parseFloat(row.phase_surface) || 0,
              middle: parseFloat(row.phase_middle) || 0,
              deep: parseFloat(row.phase_deep) || 0
            }
          };
        });
        return { success: true, data: nested };
      },
    };
    
    const handler = handlers[action];
    if (!handler) {
      console.warn('[API GET] 未対応アクション: ' + action);
      return { success: false, error: '未対応: ' + action };
    }
    
    const result = await handler();
    console.log('[API GET] ' + action + ' 結果: success=' + result.success);
    return result;
  } catch (err) {
    console.error('[API GET] ' + action + ':', err);
    return { success: false, error: err.message };
  }
};

const gasPost = async (action, body = {}) => {
  try {
    const sb = await ensureSupabase();
    console.log('[API POST] ' + action + ' Supabaseクエリ送信...');
    
    const handlers = {
      // 【保存戦略】
      // PostgRESTのupsertはスキーマキャッシュ問題で409が解消しないため、
      // DB側のRPC関数(upsert_pre_input)でSQL ON CONFLICTを直接実行する。
      // SECURITY DEFINER なのでRLSをバイパスし、確実にupsertされる。
      saveCustomerPreInput: async () => {
        const customerId = body.id || body.customerId;
        const inputData = body.preInputData || body.inputData || {};
        if (!customerId) return { success: false, error: 'IDがありません' };
        
        // v3.3: 取り合わせ（担当者／上層部）と状態の後戻り防止は preinput_save が DB 側で行う
        const role = window.GAS_CONFIG.role === 'exec' ? 'exec' : 'staff';
        const dbStatus = inputData.status === '完了' ? '完了'
          : inputData.executiveCompleted ? '上層部完了'
          : '入力済み';
        const { error } = await sb.rpc('preinput_save', {
          p_id: customerId,
          p_token: window.GAS_CONFIG.token || '',
          p_role: role,
          p_data: inputData,
          p_status: dbStatus
        });
        if (error && String(error.message || '').includes('invalid_token')) return { success: false, error: 'invalid_token' };
        if (error) throw error;
        return { success: true };
      },
    };
    
    const handler = handlers[action];
    if (!handler) {
      console.warn('[API POST] 未対応アクション: ' + action);
      return { success: false, error: '未対応: ' + action };
    }
    
    const result = await handler();
    console.log('[API POST] ' + action + ' 結果: success=' + result.success);
    return result;
  } catch (err) {
    console.error('[API POST] ' + action + ':', err);
    return { success: false, error: err.message };
  }
};

// v3.5: 出来事の記録（投げっぱなし。待たない・止めない）
let _logDisabled = false;
function logEvent(event, step = '', meta = {}) {
  if (_logDisabled) return;
  (async () => {
    try {
      const sb = await ensureSupabase();
      const { error } = await sb.rpc('preinput_log', {
        p_id: window.GAS_CONFIG.customerId || '', p_token: window.GAS_CONFIG.token || '',
        p_role: window.GAS_CONFIG.role === 'exec' ? 'exec' : 'staff',
        p_event: event, p_step: step || '', p_meta: meta || {}
      });
      if (error && /PGRST202|42883|Could not find the function|does not exist/i.test((error.message || '') + ' ' + (error.code || ''))) {
        _logDisabled = true;   // パッチ09 未適用
      }
    } catch (e) { /* 記録の失敗は回答に影響させない */ }
  })();
}

const API = {
  customerId: window.GAS_CONFIG?.customerId || '',
  
  async loadPreInput() {
    return gasGet('getCustomerPreInput', { id: this.customerId });
  },

  async loadStatus() {
    return gasGet('getPreInputStatus', { id: this.customerId, role: window.GAS_CONFIG.role === 'exec' ? 'exec' : 'staff' }); // v3.7
  },
  
  // v3.7: 保存は1本の列に並べて順に送る（後から送った保存が必ず後に着く）
  _saveChain: Promise.resolve(),
  savePreInput(preInputData) {
    const snapshot = JSON.parse(JSON.stringify(preInputData || {}));
    const run = () => gasPost('saveCustomerPreInput', { id: this.customerId, preInputData: snapshot });
    const p = this._saveChain.then(run, run);
    this._saveChain = p.catch(() => {});
    return p;
  },
  
  async loadQuestionMaster() {
    return gasGet('getQuestionMasterForPreInput', { id: this.customerId }); // v3.6: その診断の版の質問
  },
  
  async loadRecruitmentMethods() {
    // v40: 認証不要の公開エンドポイントを使用
    return gasGet('getRecruitmentMethodsPublic');
  }
};

const CountdownTimer = ({ totalSeconds, onTimeUp, isRunning }) => {
  const [remaining, setRemaining] = useState(totalSeconds);
  const intervalRef = useRef(null);
  
  useEffect(() => {
    if (!isRunning) return;
    setRemaining(totalSeconds);
    intervalRef.current = setInterval(() => {
      setRemaining(prev => {
        if (prev <= 1) {
          clearInterval(intervalRef.current);
          onTimeUp();
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [isRunning, totalSeconds]);
  
  const minutes = Math.floor(remaining / 60);
  const seconds = remaining % 60;
  const pct = (remaining / totalSeconds) * 100;
  const isLow = remaining <= 60;
  const isVeryLow = remaining <= 30;
  
  return (
    <div className={`flex items-center gap-3 px-4 py-2 rounded-xl border-2 ${
      isVeryLow ? 'bg-red-50 border-red-300 timer-pulse' : 
      isLow ? 'bg-orange-50 border-orange-300' : 
      'bg-blue-50 border-blue-200'
    }`}>
      <svg className="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <div className="flex-1">
        <div className="h-1.5 bg-gray-200 rounded-full overflow-hidden">
          <div className={`h-full rounded-full transition-all duration-1000 ${
            isVeryLow ? 'bg-red-500' : isLow ? 'bg-orange-500' : 'bg-blue-500'
          }`} style={{ width: `${pct}%` }} />
        </div>
      </div>
      <span className={`font-mono font-bold text-lg min-w-[60px] text-right ${
        isVeryLow ? 'text-red-600' : isLow ? 'text-orange-600' : 'text-blue-700'
      }`}>
        {String(minutes).padStart(2,'0')}:{String(seconds).padStart(2,'0')}
      </span>
    </div>
  );
};

// v3.8: 採用手法の表示の並び（BB診断 v81 の METHOD_CATEGORY_ORDER と同じ）
const METHOD_CATEGORY_ORDER = ['ナビサイト', '求人サイト', '合同説明会', '大学連携', 'インターンシップ', 'ダイレクトリクルーティング', '口コミ・情報サイト', 'SNS・動画', '地域特化', '業界特化'];
const HIDDEN_METHOD_KEYS = ['referral', 'company_briefing']; // 選択肢に出さない（マスターには残す）
// v3.8b: 本番のカテゴリ名は「1.ナビサイト」「求人」「業界特化型」のように番号や言い方が違うため、表示用にそろえる
const CATEGORY_ALIASES = { '求人': '求人サイト', '業界特化型': '業界特化', '地域特化型': '地域特化', 'ダイレクト': 'ダイレクトリクルーティング' };
const normalizeCategory = (c) => { const t = String(c || '').replace(/^\s*\d+\s*[.．、:：)）]\s*/, '').trim(); return CATEGORY_ALIASES[t] || t || 'その他'; };
const displayCategoryOf = (key, m) => key === 'practical_training' ? '大学連携' : normalizeCategory(m && m.category);
// 表示用にカテゴリごとにまとめる。外した手法は「選択済みのときだけ」出す
const groupMethodsForDisplay = (methods, selected) => {
  const groups = {};
  Object.entries(methods || {}).forEach(([key, m]) => {
    if (HIDDEN_METHOD_KEYS.includes(key) && !(selected && selected[key] && selected[key].active)) return;
    const cat = displayCategoryOf(key, m);
    (groups[cat] = groups[cat] || []).push([key, m]);
  });
  const known = METHOD_CATEGORY_ORDER.filter(c => groups[c]);
  const rest = Object.keys(groups).filter(c => !METHOD_CATEGORY_ORDER.includes(c)).sort();
  return [...known, ...rest].map(c => [c, groups[c]]);
};

// ========================================
// Step 3: 採用手法
// ========================================
const StepMethod = ({ data, onChange, methodMaster }) => {
  const methods = methodMaster && Object.keys(methodMaster).length > 0 ? methodMaster : DEFAULT_RECRUITMENT_METHODS;
  const groups = groupMethodsForDisplay(methods, data.recruitmentMethods); // v3.8: 決まった並び
  const [sorting, setSorting] = useState(false); // v3.8: 並べ替えの一覧を開いているか

  // 選択済み手法を優先順位順にソート
  const activeMethods = Object.entries(data.recruitmentMethods || {})
    .filter(([_, m]) => m?.active)
    .sort((a, b) => (a[1].priority || 999) - (b[1].priority || 999));

  const movePriority = (key, direction) => {
    const current = activeMethods.map(([k]) => k);
    const idx = current.indexOf(key);
    const swapIdx = idx + direction;
    if (idx < 0 || swapIdx < 0 || swapIdx >= current.length) return;
    [current[idx], current[swapIdx]] = [current[swapIdx], current[idx]];
    const updated = { ...data.recruitmentMethods };
    current.forEach((k, i) => { updated[k] = { ...updated[k], priority: i + 1 }; }); // 1から振り直す
    onChange({ ...data, recruitmentMethods: updated });
  };

  // チェック時に自動で優先順位を付与（最後尾）
  const toggleMethod = (key, checked) => {
    const updated = { ...data.recruitmentMethods };
    if (checked) {
      const maxPriority = Math.max(0, ...Object.values(updated).filter(m => m?.active).map(m => m.priority || 0));
      updated[key] = { ...updated[key], active: true, priority: maxPriority + 1 };
    } else {
      updated[key] = { ...updated[key], active: false, priority: undefined };
      const remaining = Object.entries(updated).filter(([_, m]) => m?.active).sort((a, b) => (a[1].priority || 999) - (b[1].priority || 999));
      remaining.forEach(([k], i) => { updated[k] = { ...updated[k], priority: i + 1 }; });
    }
    onChange({ ...data, recruitmentMethods: updated });
  };

  const nameOf = (key) => (methods[key] && methods[key].name) || key;

  return (
    <div className="animate-in" style={{ display:'flex', flexDirection:'column', gap:0 }}>
      <div className="glass-card rounded-2xl p-6">
        <h2 className="text-xl font-bold text-gray-800 mb-2">利用中の採用手法を選択</h2>
        <p className="text-sm text-gray-500 mb-6">現在利用している、または利用を検討している手法をすべてチェックしてください。選んだ順に、下の「注力度の優先順位」に入ります。</p>
        {groups.map(([category, catMethods], gi) => (
          <div key={category} style={{ marginBottom:20 }}>
            <h4 style={{ margin:'0 0 8px', fontSize:13, fontWeight:700, color:'var(--ink)' }}>{gi + 1}　{category}</h4>
            <div className="grid grid-cols-1 sm:grid-cols-2" style={{ gap:8 }}>
              {catMethods.map(([key, method]) => {
                const active = data.recruitmentMethods?.[key]?.active || false;
                return (
                  <label key={key} style={{ display:'flex', alignItems:'center', gap:10, minHeight:44, padding:'0 14px', borderRadius:8, cursor:'pointer',
                    border: active ? '2px solid var(--acc)' : '1px solid var(--line)', background: active ? 'var(--accSoft)' : 'var(--surf)' }}>
                    <input type="checkbox" checked={active} onChange={e => toggleMethod(key, e.target.checked)}
                      style={{ width:18, height:18, accentColor:'var(--acc)', flexShrink:0 }} />
                    <span style={{ fontSize:14, fontWeight: active ? 600 : 400, color:'var(--ink)' }}>{method.name}</span>
                  </label>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      {/* v3.8: 注力度の優先順位（画面の下に常に出る帯。1段で横にスクロール） */}
      <div style={{ position:'sticky', bottom:0, zIndex:20, marginTop:16, background:'var(--surf)', border:'1px solid var(--line)', borderRadius:10,
                    boxShadow:'0 -4px 12px rgba(20,24,31,0.08)', padding:'12px 16px 14px', display:'flex', flexDirection:'column', gap:10 }}>
        <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
          <span style={{ fontSize:14, fontWeight:700 }}>注力度の優先順位{activeMethods.length ? `（${activeMethods.length}件）` : ''}</span>
          <span style={{ fontSize:12, color:'var(--sub)' }}>{activeMethods.length ? '左ほど注力しています' : '上で手法を選ぶと、ここに並びます'}</span>
          {activeMethods.length > 1 && (
            <button type="button" className="pi-btn" onClick={() => setSorting(v => !v)} style={{ marginLeft:'auto', height:32, padding:'0 12px', fontSize:13 }}>
              {sorting ? '閉じる' : '並べ替える'}
            </button>
          )}
        </div>
        {sorting ? (
          <ol style={{ margin:0, padding:0, listStyle:'none', display:'flex', flexDirection:'column', gap:6, maxHeight:'45vh', overflowY:'auto' }}>
            {activeMethods.map(([key], idx) => (
              <li key={key} style={{ display:'flex', alignItems:'center', gap:10, minHeight:44, padding:'0 8px 0 12px', border:'1px solid var(--line)', borderRadius:8 }}>
                <span className="mono" style={{ width:24, height:24, borderRadius:'50%', background: idx === 0 ? 'var(--acc)' : 'var(--sub)', color:'#FFFFFF', fontSize:12,
                  display:'inline-flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>{idx + 1}</span>
                <span style={{ flex:1, fontSize:14 }}>{nameOf(key)}</span>
                <button type="button" aria-label={nameOf(key) + 'を上げる'} onClick={() => movePriority(key, -1)} disabled={idx === 0}
                  style={{ width:40, height:36, border:'none', background:'transparent', color: idx === 0 ? 'var(--line)' : 'var(--sub)', cursor: idx === 0 ? 'default' : 'pointer' }}>▲</button>
                <button type="button" aria-label={nameOf(key) + 'を下げる'} onClick={() => movePriority(key, 1)} disabled={idx === activeMethods.length - 1}
                  style={{ width:40, height:36, border:'none', background:'transparent', color: idx === activeMethods.length - 1 ? 'var(--line)' : 'var(--sub)', cursor: idx === activeMethods.length - 1 ? 'default' : 'pointer' }}>▼</button>
              </li>
            ))}
          </ol>
        ) : (
          <div style={{ display:'flex', gap:6, overflowX:'auto', paddingBottom:2 }}>
            {activeMethods.map(([key], idx) => (
              <span key={key} style={{ flexShrink:0, display:'inline-flex', alignItems:'center', gap:6, height:34, padding:'0 12px 0 6px', border:'1px solid var(--line)', borderRadius:17, fontSize:13, whiteSpace:'nowrap' }}>
                <span className="mono" style={{ width:22, height:22, borderRadius:'50%', background: idx === 0 ? 'var(--acc)' : 'var(--sub)', color:'#FFFFFF', fontSize:11,
                  display:'inline-flex', alignItems:'center', justifyContent:'center' }}>{idx + 1}</span>
                {nameOf(key)}
              </span>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// ========================================
// Step 4 & 5: 問診（共通）
// ========================================
// 【設計意図】
// 15分タイマー付きのA/B択一問診。直感回答を促す設計。
// 質問セットは企業規模(size) × ターゲット層 × 採用手法カテゴリで動的に構築される。
// タイマー終了で自動締切 → fix#4で即DB保存 → ブラウザ閉じても回答が失われない。
// 「回答できない場合は飛ばしてよい」を明示し、無回答もデータとして扱う（無回答率も診断指標）。
// 担当者問診と上層部問診は同じコンポーネントを roleKey='staff'/'executive' で切り替え。
// 両者の回答を照合して「組織内認識ギャップ」をBB診断で可視化するのが最終目的。
const QUIZ_GUIDE_MIN = 20; // v3.7: 目安の時間（分）。締め切りはしない

// v3.7: 経過メーター（目安20分。過ぎても締め切らない）
const ElapsedMeter = ({ startedAt }) => {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  const sec = Math.max(0, Math.floor((now - (startedAt || now)) / 1000));
  const guide = QUIZ_GUIDE_MIN * 60;
  const pct = Math.min(100, (sec / guide) * 100);
  const over = sec > guide;
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
      <div style={{ display:'flex', alignItems:'baseline', gap:8, fontSize:12, color:'var(--sub)' }}>
        <span>経過 <span className="mono" style={{ color:'var(--ink)' }}>{String(Math.floor(sec / 60)).padStart(2,'0')}:{String(sec % 60).padStart(2,'0')}</span></span>
        <span>／ 目安 {QUIZ_GUIDE_MIN}分</span>
      </div>
      <div style={{ height:4, background:'var(--rule2)', borderRadius:2, overflow:'hidden' }}>
        <div style={{ width: pct + '%', height:4, background:'var(--acc)' }} />
      </div>
      {over && <span style={{ fontSize:12, color:'var(--sub)' }}>目安を過ぎていますが、そのまま続けて大丈夫です</span>}
    </div>
  );
};

// v3.7: 問診（担当者／上層部共通）。時間制限なし・1問ごとに自動保存・終える前に確認・送信後も取り込まれるまで見直せる
const StepQuestionnaire = ({ data, onChange, roleKey, questions, title, onQuizActive, onComplete, optional = false, optionalNote = '' }) => {
  const [timerStarted, setTimerStarted] = useState(false);
  const [quizFinished, setQuizFinished] = useState(false);
  const [confirming, setConfirming] = useState(false);
  const [askFinish, setAskFinish] = useState(false);
  const [skipping, setSkipping] = useState(false);
  const [autoSavedAt, setAutoSavedAt] = useState('');
  const [autoSaveErr, setAutoSaveErr] = useState(false);
  const completedKey = `${roleKey}Completed`;
  const skippedKey = `${roleKey}Skipped`;
  const answersKey = `${roleKey}Answers`;
  const answers = data[answersKey] || {};
  const answeredCount = (questions || []).filter(q => answers[q.id]).length;
  const unansweredCount = (questions || []).length - answeredCount;
  const [qi, setQi] = useState(0);
  const quizStartRef = useRef(null);
  const dataRef = useRef(data);
  dataRef.current = data;
  const quizLive = timerStarted && !quizFinished;
  const firstUnanswered = () => { const i = (questions || []).findIndex(q => !answers[q.id]); return i < 0 ? 0 : i; };
  const choose = (q, v) => {
    const cur = (data[answersKey] || {})[q.id];
    onChange({ ...data, [answersKey]: { ...(data[answersKey] || {}), [q.id]: cur === v ? undefined : v } });
    if (cur !== v) setTimeout(() => setQi(i => Math.min(i + 1, (questions || []).length - 1)), 220);
  };
  // キーボードの A・B（問診中だけ）
  useEffect(() => {
    if (!quizLive || askFinish || !questions || !questions.length) return;
    const h = (e) => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      const k = e.key.toLowerCase();
      const q = questions[qi]; if (!q) return;
      if (k === 'a') { e.preventDefault(); choose(q, 'A'); }
      else if (k === 'b') { e.preventDefault(); choose(q, 'B'); }
      else if (e.key === 'ArrowRight') setQi(i => Math.min(i + 1, questions.length - 1));
      else if (e.key === 'ArrowLeft') setQi(i => Math.max(i - 1, 0));
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [quizLive, askFinish, qi, questions, data]);

  // v3.7: 1問ごとの自動保存（答えが変わって1.2秒後に保存。閉じても続きから再開できる）
  const answersSig = JSON.stringify(answers);
  const pendingRef = useRef(false);
  useEffect(() => {
    if (!quizLive) return;
    pendingRef.current = true;
    const t = setTimeout(async () => {
      try {
        const res = await API.savePreInput(dataRef.current);
        if (res && res.success === false) setAutoSaveErr(true);
        else { setAutoSaveErr(false); setAutoSavedAt(new Date().toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit' })); }
      } catch (e) { setAutoSaveErr(true); }
      finally { pendingRef.current = false; }
    }, 1200);
    return () => clearTimeout(t);
  }, [answersSig, quizLive]);
  // 保存待ちのときだけ、閉じる前に知らせる
  useEffect(() => {
    if (!quizLive) return;
    const handler = (e) => { if (pendingRef.current) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, [quizLive]);

  const isAlreadyCompleted = data[completedKey] === true && answeredCount > 0;

  // 全問終了（確かめた後）→ 親が保存・送信する
  useEffect(() => {
    if (!quizFinished || confirming) return;
    setConfirming(true);
    const newData = { ...data, [completedKey]: true, [roleKey + 'CompletedAt']: new Date().toISOString() };
    {
      const ans = newData[answersKey] || {};
      logEvent('quiz_end', roleKey, {
        answered: Object.keys(ans).filter(k => ans[k]).length,
        total: (questions || []).length,
        reason: 'finished',
        elapsed_sec: quizStartRef.current ? Math.round((Date.now() - quizStartRef.current) / 1000) : null
      });
    }
    if (onQuizActive) onQuizActive(false);
    if (onComplete) {
      Promise.resolve(onComplete(newData)).then(ok => {
        if (ok === false) { setQuizFinished(false); setConfirming(false); setTimerStarted(false); } // 送信失敗 → 回答済みの画面と「送信する」に戻る
      });
    }
    else { onChange(newData); API.savePreInput(newData).catch(e => console.error('[問診完了保存エラー]', e)); }
  }, [quizFinished]);

  const startQuiz = (fromIndex) => {
    setQi(fromIndex);
    setTimerStarted(true);
    quizStartRef.current = Date.now();
    logEvent('quiz_start', roleKey);
    if (onQuizActive) onQuizActive(true);
  };
  const pauseQuiz = async () => {
    try { await API.savePreInput(dataRef.current); } catch (e) {}
    setTimerStarted(false);
    if (onQuizActive) onQuizActive(false);
  };

  if (!questions || questions.length === 0) {
    return (
      <div className="glass-card rounded-2xl p-6 animate-in text-center">
        <div className="flex justify-center mb-4"><SolidIcon name="warning" className="w-16 h-16 text-amber-400" /></div>
        <h2 className="text-xl font-bold text-gray-800 mb-2">{title}</h2>
        <p className="text-gray-600 mb-2">問診の設問が読み込まれていません。</p>
        <p className="text-sm text-gray-400">「送信する」を押してください。<br />お打ち合わせ当日に問診を実施します。</p>
      </div>
    );
  }

  // 回答済み（この画面からも見直せる）
  if (isAlreadyCompleted && !timerStarted) {
    return (
      <div className="glass-card rounded-2xl p-6 animate-in text-center">
        <div className="flex justify-center mb-4"><SolidIcon name="checkCircle" className="w-16 h-16 text-green-500" /></div>
        <h2 className="text-xl font-bold text-gray-800 mb-2">{title} — 回答済み</h2>
        <p className="text-gray-600 mb-4">{answeredCount}/{questions.length}問に回答いただいています。</p>
        <button type="button" className="pi-btn" onClick={() => startQuiz(0)}>回答を見直す</button>
      </div>
    );
  }

  if (optional && data[skippedKey]) {
    return (
      <div className="glass-card rounded-2xl p-6 animate-in text-center">
        <div className="flex justify-center mb-4"><SolidIcon name="info" className="w-16 h-16 text-gray-400" /></div>
        <h2 className="text-xl font-bold text-gray-800 mb-2">{title} — スキップ済み</h2>
        <p className="text-gray-600 mb-2">この問診はスキップされました。</p>
        <button onClick={() => onChange({ ...data, [skippedKey]: false })}
          className="text-xs px-4 py-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition font-medium">やっぱり回答する</button>
      </div>
    );
  }

  // 開始前（途中まで答えていれば「続きから」）
  if (!timerStarted) {
    const resuming = answeredCount > 0;
    return (
      <div className="glass-card rounded-2xl p-6 animate-in">
        <h2 className="text-xl font-bold text-gray-800 mb-4">{title}</h2>
        {optional && optionalNote && (
          <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl mb-4 space-y-2">
            <p className="text-sm text-blue-800 font-bold flex items-center gap-1.5"><SolidIcon name="info" className="w-4 h-4" />この問診は任意です</p>
            <p className="text-sm text-blue-700">{optionalNote}</p>
          </div>
        )}
        <div className="p-4 bg-gray-50 border border-gray-200 rounded-xl mb-6 space-y-2">
          <p className="text-sm text-gray-800 font-bold flex items-center gap-1.5"><SolidIcon name="clock" className="w-4 h-4" />目安：{QUIZ_GUIDE_MIN}分（時間制限はありません）</p>
          <p className="text-sm text-gray-700">直感で「こちらに近い」と思う方を選択してください。<span className="font-bold">どちらにも回答できない場合は、選択せずに飛ばして構いません。</span></p>
          <p className="text-sm text-gray-700">1問ごとに自動で保存されます。途中で閉じても、同じURLを開くと続きから答えられます。</p>
          <p className="text-sm text-gray-700">送信した後も、担当者が受け取るまでは同じURLから見直せます。</p>
        </div>
        <div className="text-center">
          <p className="text-gray-600 mb-4">全{questions.length}問の問診です{resuming ? `（${answeredCount}問 回答済み）` : ''}</p>
          <button onClick={() => startQuiz(resuming ? firstUnanswered() : 0)}
            className="btn-ripple px-8 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-lg rounded-2xl hover:from-blue-700 hover:to-indigo-700 transition shadow-lg hover:shadow-xl">
            {resuming ? '続きから回答する' : '問診を開始する'}
          </button>
          {optional && (
            <button disabled={skipping}
              onClick={() => { if (skipping) return; setSkipping(true); const nd = { ...data, [skippedKey]: true }; onChange(nd); if (onComplete) onComplete(nd); }}
              className="block mx-auto mt-4 text-sm px-6 py-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition">
              {skipping ? '保存中...' : 'この問診をスキップする →'}
            </button>
          )}
        </div>
      </div>
    );
  }

  if (quizFinished) {
    return (
      <div className="glass-card rounded-2xl p-6 animate-in text-center">
        <p className="text-gray-600 font-bold">回答を送信しています...</p>
      </div>
    );
  }

  // 問診（1問ずつ）
  const q = questions[Math.min(qi, questions.length - 1)];
  const cur = answers[q.id];
  const isLast = qi >= questions.length - 1;
  const choiceBtn = (v, text) => {
    const on = cur === v;
    return (
      <button type="button" onClick={() => choose(q, v)} aria-pressed={on}
        style={{ display:'flex', alignItems:'center', gap:16, width:'100%', padding:'18px 20px', textAlign:'left', cursor:'pointer',
                 borderRadius:8, border: on ? '2px solid var(--acc)' : '1px solid var(--line)', background: on ? 'var(--accSoft)' : 'var(--surf)' }}>
        <span style={{ width:30, height:30, flexShrink:0, borderRadius:6, display:'inline-flex', alignItems:'center', justifyContent:'center', fontWeight:600,
                       background: on ? 'var(--acc)' : 'transparent', color: on ? '#FFFFFF' : 'var(--sub)', border: on ? 'none' : '1px solid var(--line)' }}>{v}</span>
        <span style={{ fontSize:17, lineHeight:1.7, color:'var(--ink)' }}>{text}</span>
      </button>
    );
  };
  return (
    <div className="animate-in" style={{ display:'flex', flexDirection:'column', gap:20 }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
        <h2 style={{ margin:0, fontSize:18, fontWeight:600 }}>{title}</h2>
        <span className="mono" style={{ fontSize:13, color:'var(--sub)' }}>回答 {answeredCount} / {questions.length}</span>
        <span style={{ fontSize:12, color: autoSaveErr ? '#B42318' : 'var(--sub)' }}>
          {autoSaveErr ? '保存できませんでした（通信を確かめてください）' : autoSavedAt ? `自動保存 ${autoSavedAt}` : ''}
        </span>
        <div style={{ marginLeft:'auto', minWidth:220, flex:'0 1 320px' }}>
          <ElapsedMeter startedAt={quizStartRef.current} />
        </div>
      </div>
      <div style={{ height:3, background:'var(--rule2)', borderRadius:2, overflow:'hidden' }}>
        <div style={{ width: `${((qi + 1) / questions.length) * 100}%`, height:3, background:'var(--acc)', transition:'width 0.2s' }} />
      </div>
      {askFinish ? (
        <section className="glass-card" style={{ padding:'28px 32px', display:'flex', flexDirection:'column', gap:16 }}>
          <p style={{ margin:0, fontSize:18, fontWeight:600 }}>回答を終えて送信しますか？</p>
          <p style={{ margin:0, fontSize:14, color:'var(--sub)', lineHeight:1.8 }}>
            {unansweredCount > 0 ? <>未回答が <span style={{ fontWeight:700, color:'var(--ink)' }}>{unansweredCount}問</span> あります（答えられない問いは飛ばして構いません）。<br /></> : null}
            送信した後も、担当者が受け取るまでは同じURLから見直せます。
          </p>
          <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
            <button type="button" className="pi-btn" onClick={() => { setAskFinish(false); if (unansweredCount > 0) setQi(firstUnanswered()); }}>
              {unansweredCount > 0 ? '未回答の問いに戻る' : '問いに戻る'}
            </button>
            <button type="button" className="pi-btn primary" onClick={() => { setAskFinish(false); setQuizFinished(true); }}>終えて送信する</button>
          </div>
        </section>
      ) : (
        <section className="glass-card" style={{ padding:'32px 32px 28px', display:'flex', flexDirection:'column', gap:24 }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
            <span className="mono" style={{ fontSize:14, color:'var(--sub)' }}>Q {qi + 1} / {questions.length}</span>
            <span style={{ fontSize:13, color:'var(--sub)' }}>直感で、近いほうを選んでください</span>
          </div>
          <p style={{ margin:0, fontSize:22, fontWeight:600, lineHeight:1.7, whiteSpace:'pre-line' }}>{q.question}</p>
          <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
            {choiceBtn('A', q.choiceA)}
            {choiceBtn('B', q.choiceB)}
          </div>
        </section>
      )}
      {!askFinish && (
        <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
          <button type="button" className="pi-btn" onClick={() => setQi(i => Math.max(i - 1, 0))} disabled={qi === 0}>前の問い</button>
          <button type="button" className="pi-btn" onClick={pauseQuiz}>いったん中断する</button>
          <span style={{ fontSize:12, color:'var(--sub)' }}>キーボードの A・B でも選べます。答えられない問いは飛ばして構いません</span>
          <span style={{ marginLeft:'auto', display:'flex', gap:8 }}>
            {!isLast && <button type="button" className="pi-btn" onClick={() => setQi(i => Math.min(i + 1, questions.length - 1))}>{cur ? '次の問い' : '答えずに次へ'}</button>}
            <button type="button" className={isLast ? 'pi-btn primary' : 'pi-btn'} onClick={() => setAskFinish(true)} disabled={quizFinished || confirming}>回答を終える</button>
          </span>
        </div>
      )}
    </div>
  );
};

// ========================================
// Step 6: ファネル数値
// ========================================
const StepFunnel = ({ data, onChange, methodMaster }) => {
  const methods = methodMaster && Object.keys(methodMaster).length > 0 ? methodMaster : DEFAULT_RECRUITMENT_METHODS;
  const jobLabels = data.jobType ? (JOB_TYPES.find(j => j.key === data.jobType)?.label || data.jobType) : '';
  const allActiveChannels = Object.entries(data.recruitmentMethods || {})
    .filter(([_, m]) => m?.active)
    .sort((a, b) => (a[1].priority || 999) - (b[1].priority || 999))
    .map(([key, m], idx) => ({
      key,
      name: methods[key]?.name || key,
      shortName: (methods[key]?.name || key).split('（')[0].substring(0, 8),
      category: methods[key]?.category || DEFAULT_RECRUITMENT_METHODS[key]?.category || '',
      priority: m.priority || (idx + 1)
    }))
;
  // v3.7: 入力欄は一番注力している手法（優先順位1位）だけ。量が多いと未記入で終わるため。
  //   合計は選んだ手法すべての値で出す（以前入れた他の手法の値も含めて BB診断の表示と同じ合計にする）
  const activeChannels = allActiveChannels.slice(0, 1);
  
  const funnelData = data.funnelData || {};
  const availableYears = funnelData.availableYears || ['25卒', '26卒', '27卒', '28卒', '29卒', '30卒'];
  const selectedYear = funnelData.selectedYear || '27卒';
  const yearData = funnelData.yearData?.[selectedYear] || {};
  
  const setSelectedYear = (year) => {
    onChange({ ...data, funnelData: { ...funnelData, selectedYear: year } });
  };
  
  // BB診断と同じフェーズキー（選考ステップ数に応じて動的展開）
  const screeningSteps = yearData.screeningSteps || funnelData.screeningSteps || 1;
  const phases = [
    { key: 'awareness', label: '認知' },
    { key: 'interest', label: '興味' },
    { key: 'contact', label: '接触' },
    { key: 'screening', label: '選考', rowSpan: screeningSteps,
      subLabels: screeningSteps === 1 ? [''] : Array.from({length: screeningSteps}, (_, i) => `${i + 1}次面接`) },
    { key: 'offer', label: '内々定' },
    { key: 'acceptance', label: '承諾' }
  ];
  
  const getPlaceholder = (phaseKey, channelKey) => {
    // 1. DBマスターのphaseLabels（v3.1 note#9: recruitment_methodsテーブルにphaseLabels列追加で解消予定）
    if (methods[channelKey]?.phaseLabels?.[phaseKey]) return methods[channelKey].phaseLabels[phaseKey];
    // 2. ローカルDEFAULTのphaseLabels（DB未対応手法のフォールバック）
    if (DEFAULT_RECRUITMENT_METHODS[channelKey]?.phaseLabels?.[phaseKey]) return DEFAULT_RECRUITMENT_METHODS[channelKey].phaseLabels[phaseKey];
    // 3. 最終フォールバック（DBに新規追加手法でDEFAULTにもない場合）
    const FALLBACK = { awareness: '認知数', interest: '興味数', contact: '接触数', screening: '選考参加数', offer: '内々定数', acceptance: '承諾数' };
    return FALLBACK[phaseKey] || '数値を入力';
  };
  
  // BB診断と同じ channelData 形式: {phase}_{channelKey} or {phase}_{subIdx}_{channelKey}
  const getChannelValue = (phaseKey, channelKey, subIdx) => {
    const dataKey = subIdx !== undefined ? `${phaseKey}_${subIdx}_${channelKey}` : `${phaseKey}_${channelKey}`;
    return yearData.channelData?.[dataKey] ?? '';
  };
  
  const setChannelValue = (phaseKey, channelKey, value, subIdx) => {
    const dataKey = subIdx !== undefined ? `${phaseKey}_${subIdx}_${channelKey}` : `${phaseKey}_${channelKey}`;
    const newChannelData = {
      ...yearData.channelData,
      [dataKey]: value === '' ? '' : (parseInt(value) || 0)
    };
    
    // BB診断と同じキーで合計を再計算
    const calcTotalInner = (pk, si) => allActiveChannels.reduce((sum, ch) => {
      const k = si !== undefined ? `${pk}_${si}_${ch.key}` : `${pk}_${ch.key}`;
      const v = newChannelData[k];
      return sum + (parseInt(v) || 0);
    }, 0);
    
    const totals = {
      targetAwareness: calcTotalInner('awareness'),
      interest: calcTotalInner('interest'),
      applications: calcTotalInner('contact'),
      screening: screeningSteps > 1 ? calcTotalInner('screening', 0) : calcTotalInner('screening'),
      offers: calcTotalInner('offer'),
      acceptance: calcTotalInner('acceptance')
    };
    
    onChange({
      ...data,
      funnelData: {
        ...funnelData,
        ...totals,
        selectedYear: selectedYear,
        yearData: {
          ...funnelData.yearData,
          [selectedYear]: {
            ...yearData,
            ...totals,
            channelData: newChannelData
          }
        }
      }
    });
  };
  
  const calcTotal = (phaseKey, subIdx) => allActiveChannels.reduce((sum, ch) => {
    const k = subIdx !== undefined ? `${phaseKey}_${subIdx}_${ch.key}` : `${phaseKey}_${ch.key}`;
    const v = yearData.channelData?.[k] ?? '';
    return sum + (parseInt(v) || 0);
  }, 0);
  
  return (
    <div className="glass-card rounded-2xl p-6 animate-in">
      <h2 className="text-xl font-bold text-gray-800 mb-2">採用ファネル数値</h2>
      
      <div className="p-3 bg-red-50 border border-red-200 rounded-xl mb-4">
        <p className="text-sm text-red-800">
          <span className="font-bold inline-flex items-center gap-1"><SolidIcon name="warning" className="w-4 h-4" />注意：</span>
          以下は<span className="font-bold">「{jobLabels || '選択した職種'}」</span>を採用する際の移行数値です。
          全社的な合計値ではなく、該当職種の採用に限った数値をご入力ください。
        </p>
      </div>
      
      {/* 年度選択 */}
      <div className="flex items-center gap-3 mb-4">
        <label className="text-sm font-bold text-gray-700">年度：</label>
        <div className="flex gap-1 p-1 bg-gray-100 rounded-lg overflow-x-auto flex-1">
          {availableYears.map(year => (
            <button
              key={year}
              onClick={() => setSelectedYear(year)}
              className={`px-3 py-1.5 text-xs font-medium rounded-md transition whitespace-nowrap ${
                selectedYear === year
                  ? 'bg-white text-blue-600 shadow-sm font-bold'
                  : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50'
              }`}
            >
              {year}
              {funnelData.yearData?.[year]?.channelData && 
               Object.keys(funnelData.yearData[year].channelData).length > 0 && (
                <span className="ml-1 w-1.5 h-1.5 bg-green-500 rounded-full inline-block"></span>
              )}
            </button>
          ))}
        </div>
        <span className="text-xs text-blue-600 font-medium bg-blue-50 px-2 py-1 rounded whitespace-nowrap">
          {selectedYear}編集中
        </span>
      </div>
      
      {/* 採用目標人数 */}
      <div className="mb-6 p-4 bg-green-50 border border-green-200 rounded-xl">
        <label className="block text-sm font-bold text-green-800 mb-2">採用目標人数（承諾目標）</label>
        <div className="flex items-center gap-2">
          <input
            type="number"
            min="0"
            value={yearData.targetHires ?? funnelData.targetHires ?? ''}
            onChange={e => {
              const v = e.target.value === '' ? '' : (parseInt(e.target.value) || 0);
              onChange({
                ...data,
                funnelData: {
                  ...funnelData,
                  selectedYear: selectedYear,
                  yearData: {
                    ...funnelData.yearData,
                    [selectedYear]: { ...yearData, targetHires: v }
                  }
                }
              });
            }}
            placeholder="例: 5"
            className="w-32 px-4 py-3 border border-gray-300 rounded-xl text-center text-lg font-bold focus:ring-2 focus:ring-green-500"
          />
          <span className="text-gray-600 font-medium">人</span>
        </div>
      </div>
      
      {/* v3.1 hotfix: 選考ステップ数 */}
      <div className="mb-6 flex items-center gap-3">
        <label className="text-sm font-bold text-gray-700">選考ステップ数：</label>
        <select
          value={yearData.screeningSteps || funnelData.screeningSteps || 1}
          onChange={e => {
            const v = parseInt(e.target.value);
            onChange({
              ...data,
              funnelData: {
                ...funnelData,
                screeningSteps: v,
                selectedYear: selectedYear,
                yearData: {
                  ...funnelData.yearData,
                  [selectedYear]: { ...yearData, screeningSteps: v }
                }
              }
            });
          }}
          className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
        >
          {[1,2,3,4,5].map(n => (
            <option key={n} value={n}>{n}段階</option>
          ))}
        </select>
        <span className="text-xs text-gray-500">（1次面接、2次面接など）</span>
      </div>
      
      {activeChannels.length === 0 ? (
        /* チャネル未選択時：合計入力フォーム */
        <div>
          <h3 className="text-sm font-bold text-gray-700 mb-3">各フェーズの合計人数</h3>
          <p className="text-xs text-gray-500 mb-4">「採用手法」ステップで手法を選択すると、手法別の入力ができます。</p>
          <div className="grid grid-cols-2 gap-3">
            {[
              { key: 'targetAwareness', label: '認知', ph: '例: 10000' },
              { key: 'interest', label: '興味', ph: '例: 1000' },
              { key: 'applications', label: '接触', ph: '例: 200' },
              { key: 'screening', label: '選考', ph: '例: 80' },
              { key: 'offers', label: '内々定', ph: '例: 10' },
              { key: 'acceptance', label: '承諾', ph: '例: 5' }
            ].map(item => (
              <div key={item.key}>
                <label className="block text-xs font-bold text-gray-700 mb-1">{item.label}</label>
                <input
                  type="number"
                  min="0"
                  value={yearData[item.key] ?? funnelData[item.key] ?? ''}
                  onChange={e => {
                    const v = e.target.value === '' ? '' : (parseInt(e.target.value) || 0);
                    onChange({
                      ...data,
                      funnelData: {
                        ...funnelData,
                        [item.key]: v,
                        selectedYear: selectedYear,
                        yearData: {
                          ...funnelData.yearData,
                          [selectedYear]: { ...yearData, [item.key]: v }
                        }
                      }
                    });
                  }}
                  placeholder={item.ph}
                  className="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                />
              </div>
            ))}
          </div>
        </div>
      ) : (
        /* v3.7: 一番注力している手法だけ（縦に1列） */
        <div>
          <h3 className="text-sm font-bold text-gray-700 mb-1">
            一番注力している手法「{activeChannels[0].name}」の数値を教えてください
          </h3>
          <p className="text-xs text-gray-500 mb-4">分かる項目だけで構いません。不明な項目は空欄のまま進めます。</p>
          <div style={{ display:'flex', flexDirection:'column', gap:10, maxWidth:520 }}>
            {phases.flatMap(phase => {
              const ch = activeChannels[0];
              const subs = (phase.subLabels && phase.subLabels.length > 1) ? phase.subLabels.map((sl, i) => ({ sl, i })) : [{ sl: '', i: undefined }];
              return subs.map(({ sl, i }) => {
                const id = 'fn_' + phase.key + (i !== undefined ? '_' + i : '');
                return (
                  <div key={id} style={{ display:'flex', alignItems:'center', gap:12 }}>
                    <label htmlFor={id} style={{ width:140, flexShrink:0, fontSize:14, fontWeight:600, color:'var(--ink)' }}>
                      {phase.label}{sl ? <span style={{ fontWeight:400, color:'var(--sub)', marginLeft:6 }}>{sl}</span> : null}
                    </label>
                    <input id={id} type="number" min="0" inputMode="numeric"
                      value={getChannelValue(phase.key, ch.key, i)}
                      onChange={e => setChannelValue(phase.key, ch.key, e.target.value, i)}
                      placeholder={sl || getPlaceholder(phase.key, ch.key)}
                      className="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 placeholder-gray-300"
                      style={{ width:160 }} />
                    <span style={{ fontSize:13, color:'var(--sub)' }}>人</span>
                  </div>
                );
              });
            })}
          </div>
        </div>
      )}
    </div>
  );
};

    <p className="text-gray-600 mb-6">
      ご回答いただきありがとうございます。<br />
      お打ち合わせ当日、この内容をもとに診断いたします。

      <div className="p-4 bg-gray-50 border border-gray-200 rounded-xl mb-4">
        <p className="text-sm text-gray-700">回答は担当者が受け取りました。<br />変更したい場合は、担当者にご連絡ください。</p>

      <div className="mb-4">
        <button type="button" className="pi-btn" onClick={onReview}>回答を見直す・続きから答える</button>

        <button type="button" className="pi-btn" onClick={() => setShowAnswers(v => !v)}>{showAnswers ? '回答を閉じる' : '回答を見る'}</button>
        {showAnswers && (
          <ol style={{ marginTop:12, paddingLeft:20, display:'flex', flexDirection:'column', gap:8, fontSize:13, color:'var(--ink)' }}>
            {reviewList.map(r => (

        このページを閉じていただいて問題ありません。<br />
        ご不明点は担当学生アドバイザーまでお問い合わせください。
      </p>
    </div>
  </div>
  );
};

// ========================================
// メインApp (v3.1: バグ修正4件 + 運用改善5件)
// ========================================
const App = () => {
  const toast = useToast();
  const urlRole = window.GAS_CONFIG.role || 'staff';
  const urlSize = window.GAS_CONFIG.companySize || '';
  const urlToken = window.GAS_CONFIG.token || '';
  const customerId = API.customerId;
  const isExec = urlRole === 'exec';
  
  // v3.3: token の正否は DB（preinput_get）の返事で判断する。ここでは「付いているか」だけを見る
  const isTokenValid = !!(customerId && urlToken);
  
  const steps = useMemo(() => buildSteps(urlRole, !!urlSize), [urlRole, urlSize]);
  
  const [currentStep, setCurrentStep] = useState(0);
  const [data, setData] = useState({
    jobType: '', jobTypeOther: '', companySize: urlSize || '',
    targetLayers: {}, recruitmentMethods: {},
    staffAnswers: {}, executiveAnswers: {}, funnelData: {},
    challengeToSolve: '', pastAttempts: '', status: '入力中'
  });
  const [questionMaster, setQuestionMaster] = useState(null);
  const [methodMaster, setMethodMaster] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [navigating, setNavigating] = useState(false);
  const [completed, setCompleted] = useState(false);
  const [locked, setLocked] = useState(false); // v3.7: BB診断に取り込み済み（この役割の回答は見るだけ）
  const [askSubmit, setAskSubmit] = useState(false); // v3.7: 未回答のまま「送信する」を押したときの確認
  const [error, setError] = useState('');
  const [privacyAgreed, setPrivacyAgreed] = useState(false);
  const [started, setStarted] = useState(false);
  const [quizActive, setQuizActive] = useState(false);
  const maxRetries = 2;
  const [retryCount, setRetryCount] = useState(0);
  
  useEffect(() => {
    (async () => {
      // v3.1 fix#1: リトライ時にloading状態を復元
      if (retryCount > 0) setLoading(true);
      try {
        if (customerId && !isTokenValid) {
          setError('このURLは無効です。\n正しいURLを担当コンサルタントから受け取ってください。');
          setLoading(false); return;
        }
        if (!customerId) {
          setError('問い合わせ番号が指定されていません。\nURLに ?id=XXXXX&tk=YYYYY の形式でアクセスしてください。');
          setLoading(false); return;
        }
        console.log('[事前問診 v4.0] ロード role=' + urlRole + ' size=' + urlSize + ' id=' + customerId);
        const pingRes = await gasGet('ping');
        if (!pingRes.success) throw new Error('サーバーに接続できません。');
        
        const preRes = await API.loadPreInput();
        if (!preRes.success && preRes.error === 'invalid_token') {
          setError('このURLは無効です。\n正しいURLを担当コンサルタントから受け取ってください。');
          setLoading(false); return;
        }
        logEvent('open');   // v3.5: URLを開いた（token が通ったときだけ）
        if (preRes.success && preRes.data) {
          const ld = { ...preRes.data };
          const sHas = Object.keys(ld.staffAnswers || {}).filter(k => ld.staffAnswers[k]).length > 0;
          const eHas = Object.keys(ld.executiveAnswers || {}).filter(k => ld.executiveAnswers[k]).length > 0;
          if (ld.staffCompleted && !sHas) ld.staffCompleted = false;
          if (ld.executiveCompleted && !eHas) ld.executiveCompleted = false;
          if (urlSize) ld.companySize = urlSize;
          setData(prev => ({ ...prev, ...ld }));
          if (isExec && ld.executiveCompleted) setCompleted(true);
          else if (!isExec && ld.status === '完了') setCompleted(true);
          // v3.7: 送信の後に取り込まれていれば見るだけ（送信した時刻より後に取り込まれたか）
          try {
            const st = await API.loadStatus();
            const impAt = st && st.success && st.data && st.data.importedAt;
            const doneFlag = isExec ? !!ld.executiveCompleted : ld.status === '完了';
            const doneAt = st && st.data && st.data.lastSubmitAt; // DB の時計（最後の送信の記録）。無ければ取込済みで見るだけ
            if (impAt && doneFlag && (!doneAt || new Date(impAt).getTime() >= new Date(doneAt).getTime())) setLocked(true);
          } catch (e) { console.warn('[事前問診 v3.7] 取込状態の確認に失敗（見直し可として続行）', e && e.message); }
          // v3.1 fix#5: exec URLにsize指定なし＆担当者も未入力の場合は警告
          if (isExec && !urlSize && !ld.companySize) {
            console.warn('[事前問診 v3.5] 上層部アクセスだが企業規模が不明。フォールバック適用。');
          }
        } else if (isExec && !urlSize) {
          // v3.1 fix#5: 担当者の事前データも存在しない場合
          setError('担当者の方がまだ事前問診を開始していません。\n担当者の方の問診完了後に再度アクセスしてください。\n\n※URLに &size= パラメータが含まれている場合はこのメッセージは表示されません。');
          setLoading(false); return;
        }
        
        let qLoaded = false;
        for (let qa = 0; qa < 3 && !qLoaded; qa++) {
          const qRes = await API.loadQuestionMaster();
          if (qRes.success && qRes.data) { setQuestionMaster(qRes.data); qLoaded = true; }
          else if (qRes.success) { qLoaded = true; }
          else { if (qa < 2) await new Promise(r => setTimeout(r, 1500*(qa+1)));
            else setError('問診マスターの読み込みに失敗しました。\nページを再読み込みしてください。'); }
        }
        const mRes = await API.loadRecruitmentMethods();
        if (mRes.success && mRes.data) setMethodMaster(mRes.data);
      } catch (e) {
        if (retryCount < maxRetries) { setRetryCount(prev => prev + 1); return; }
        setError('データの読み込みに失敗しました。\n' + e.message);
      } finally { setLoading(false); }
    })();
  }, [retryCount]);
  
  const determinedSize = urlSize || data.companySize || '';
  
  const getQuestions = useCallback((roleKey) => {
    if (!questionMaster) return [];
    let questions = [];
    if (determinedSize) {
      const qs = questionMaster.base?.[determinedSize]?.[roleKey];
      if (qs && qs.length > 0) questions = [...qs];
    } else {
      for (const sz of ['small','medium','large']) {
        const qs = questionMaster.base?.[sz]?.[roleKey];
        if (qs && qs.length > 0) { questions = [...qs]; break; }
      }
    }
    Object.keys(pickV2Layers(data.targetLayers)).filter(k => data.targetLayers[k]?.enabled).forEach(layer => { // v3.9: 新しい5区分だけ
      questions = [...questions, ...(questionMaster.targetLayer?.[layer]?.[roleKey] || [])];
    });
    ['surface','middle','deep'].forEach(d => {
      questions = [...questions, ...(questionMaster.depth?.[d]?.[roleKey] || [])];
    });
    const mM = methodMaster && Object.keys(methodMaster).length > 0 ? methodMaster : DEFAULT_RECRUITMENT_METHODS;
    const actMethods = Object.keys(data.recruitmentMethods || {}).filter(k => data.recruitmentMethods[k]?.active);
    const actCats = [...new Set(actMethods.map(k => mM[k]?.category).filter(Boolean))];
    actCats.forEach(cat => {
      questions = [...questions, ...(questionMaster.recruitmentMethod?.[cat]?.[roleKey] || [])];
      Object.entries(questionMaster.recruitmentMethod || {}).forEach(([key, roles]) => {
        if (mM[key] && mM[key].category === cat) questions = [...questions, ...(roles?.[roleKey] || [])];
      });
    });
    const seen = new Set();
    const useNewGrad = data.midCareerStance === 'newgrad'; // v4.0: 「新卒にこだわりたい」だけ新卒版の言い方
    return questions.filter(q => { if (seen.has(q.id)) return false; seen.add(q.id); return true; })
      .map(q => (useNewGrad && q.newGradText && typeof q.newGradText === 'object') ? applyNewGradText(q) : q);
  }, [questionMaster, data.targetLayers, data.recruitmentMethods, methodMaster, determinedSize, data.midCareerStance]);
  
  const [savedAt, setSavedAt] = useState('');
  const saveProgress = useCallback(async (nd) => {
    setSaving(true);
    try {
      const res = await API.savePreInput(nd || data);
      // v3.4: 失敗を成功と見せない（関数は success:false を返すことがある）
      if (res && res.success === false) { toast('保存できませんでした。通信を確かめて、もう一度お試しください。', 'error', 5000); logEvent('save_error', steps[currentStep]?.id || '', { message: String(res.error || '').slice(0, 200) }); return false; }
      setSavedAt(new Date().toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit' }));
      return true;
    }
    catch (e) { toast('保存できませんでした。通信を確かめて、もう一度お試しください。', 'error', 5000); return false; }
    finally { setSaving(false); }
  }, [data]);
  
  // v3.7: 送信（最後の手順。問診を終えたときもここを通る）
  const submitAll = async (base) => {
    const now = new Date().toISOString();
    const hasStaffAns = Object.values(base.staffAnswers || {}).some(Boolean);
    const finalData = isExec ? { ...base, executiveCompleted: true, executiveCompletedAt: now }
                             : { ...base, status: '完了', staffCompleted: hasStaffAns, staffCompletedAt: now };
    setData(finalData);
    const ok = await saveProgress(finalData);
    if (!ok) return false;   // 保存できなければ完了画面にしない（もう一度「送信する」で送り直せる）
    setCompleted(true);
    logEvent('submit', steps[currentStep]?.id || '');
    return true;
  };
  // v3.7: 問診を終えたとき。最後の手順ならそのまま送信、そうでなければ保存だけ
  const onQuizComplete = async (nd) => {
    if (currentStep >= steps.length - 1) { setNavigating(true); try { return await submitAll(nd); } finally { setNavigating(false); } }
    setData(nd); return await saveProgress(nd);
  };
  // v3.7: 送信後の見直し（取り込まれる前だけ）
  const reviewAgain = () => {
    setCompleted(false); setStarted(true); setCurrentStep(0);
    logEvent('review', isExec ? 'executive' : 'staff');
  };

  const goNext = async () => {
    if (navigating) return;
    // v3.7: 最後の手順（問診）で未回答が残っていれば、送る前に確かめる
    if (currentStep >= steps.length - 1 && quizUnanswered > 0 && !askSubmit) { setAskSubmit(true); return; }
    setAskSubmit(false);
    setNavigating(true);
    try {
      window.scrollTo(0, 0);
      if (currentStep >= steps.length - 1) {
        // v3.1 fix#3: 最終ステップはfinalDataのみ保存（二重保存防止）
        await submitAll(data);
      } else {
        await saveProgress(data);
        logEvent('step', steps[currentStep + 1]?.id || '', { from: steps[currentStep]?.id || '' });
        setCurrentStep(prev => prev + 1);
      }
    } finally { setNavigating(false); }
  };
  const goPrev = () => {
    if (navigating) return; setNavigating(true); setAskSubmit(false);
    window.scrollTo(0, 0); setCurrentStep(prev => Math.max(0, prev - 1));
    setTimeout(() => setNavigating(false), 300);
  };
  
  const canProceed = useMemo(() => {
    const sid = steps[currentStep]?.id;
    if (sid === 'companySize') return !!data.companySize;
    if (sid === 'jobType') return !!data.jobType;
    if (sid === 'target') {
      // v3.9: 新しい5区分のどれかを選び、文系・理系は「主に狙う大学」も選ぶ（割合は聞かない）
      const tl = pickV2Layers(data.targetLayers);
      const on = V2_LAYER_KEYS.filter(k => tl[k]?.enabled);
      if (on.length === 0) return false;
      if (on.some(k => (k === 'bunkei' || k === 'rikei') && !tl[k].level)) return false;
      return true;
    }
    if (sid === 'method') return Object.values(data.recruitmentMethods || {}).some(v => v?.active);
    return true;
  }, [currentStep, data, steps]);
  
  const staffQuestions = useMemo(() => getQuestions('staff'), [getQuestions]);
  const executiveQuestions = useMemo(() => getQuestions('executive'), [getQuestions]);
  
  // v3.6: 「回答済みの質問IDが今の質問に無ければ回答を空に戻す」処理は削除（開き直しで回答が消えていた）
  
  if (loading) return (<div className="min-h-screen flex items-center justify-center"><div className="text-center"><div className="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-4"></div><p className="text-gray-600">読み込み中...</p></div></div>);
  if (error) return (<div className="min-h-screen flex items-center justify-center p-4"><div className="glass-card rounded-2xl p-8 text-center max-w-md"><div className="flex justify-center mb-4"><SolidIcon name="warning" className="w-14 h-14 text-amber-500" /></div><p className="text-red-600 font-bold mb-4 whitespace-pre-line">{error}</p><button onClick={() => window.location.reload()} className="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold">再読み込み</button></div></div>);
  if (completed) {
    // v3.7: 取り込み後は回答を見るだけ（問いと選んだ答え）
    const rk = isExec ? 'executive' : 'staff';
    const qs = isExec ? executiveQuestions : staffQuestions;
    const ans = data[rk + 'Answers'] || {};
    const reviewList = locked ? qs.map(q => ({ id: q.id, question: q.question, answerText: ans[q.id] === 'A' ? q.choiceA : ans[q.id] === 'B' ? q.choiceB : '' })) : null;
    return (<div className="min-h-screen flex items-center justify-center p-4"><CompletionScreen locked={locked} onReview={reviewAgain} reviewList={reviewList} /></div>);
  }
  
  if (!started) {
    return (
      <div className="max-w-2xl mx-auto px-4 py-8">
        <div className="glass-card rounded-2xl p-8 animate-in">
          <div className="text-center mb-6">
            <h1 className="text-2xl font-bold text-gray-800">採用ブラックボックス診断<sup className="text-xs">®</sup></h1>
            <p className="text-sm text-gray-500 mt-1">{isExec ? '上層部問診フォーム' : '事前問診フォーム'}</p>
          </div>
          {isExec ? (
            <div className="p-5 bg-purple-50 border border-purple-200 rounded-xl mb-6">
              <h3 className="font-bold text-gray-800 mb-3">上層部の方へ</h3>
              <p className="text-sm text-gray-700 leading-relaxed">本フォームは<span className="font-bold text-purple-700">経営層・管理職の方専用</span>の問診です。貴社の採用方針・ビジョンについてご自身のお考えをそのままお答えください。担当者の方の回答と照合し、組織内の認識ギャップを分析いたします。</p>
              <p className="text-sm text-gray-600 mt-3">所要時間：10〜15分程度</p>
            </div>
          ) : (
            <div className="p-5 bg-gray-50 border border-gray-200 rounded-xl mb-6">
              <h3 className="font-bold text-gray-800 mb-3">本診断について</h3>
              <p className="text-sm text-gray-700 leading-relaxed mb-4">貴社の採用活動における「見えていない課題」を数値化・可視化するための専門ツールです。お打ち合わせ当日に<span className="font-bold text-blue-700">貴社だけの具体的な「解決策」</span>をご提示します。</p>
              <div className="flex flex-col gap-2 text-sm text-gray-700">
                <div className="flex items-center gap-2"><SolidIcon name="clock" className="w-4 h-4 text-blue-500 flex-shrink-0" /><span><span className="font-bold">所要時間：</span>20〜30分程度</span></div>
                <div className="flex items-center gap-2"><SolidIcon name="save" className="w-4 h-4 text-blue-500 flex-shrink-0" /><span><span className="font-bold">途中保存：</span>回答内容は一時保存が可能です。</span></div>
              </div>
            </div>
          )}
          <div className="p-5 bg-blue-50 border border-blue-200 rounded-xl mb-6">
            <h3 className="font-bold text-gray-800 mb-3">情報の取り扱いについて</h3>
            <ul className="text-sm text-gray-700 space-y-2">
              <li className="flex items-start gap-2"><SolidIcon name="dot" className="w-3 h-3 mt-1 text-blue-500 flex-shrink-0" /><span>ご入力いただく情報は、株式会社Gakusapoが<span className="font-bold">厳重に管理</span>し、本診断の目的以外には一切使用いたしません。</span></li>
              <li className="flex items-start gap-2"><SolidIcon name="dot" className="w-3 h-3 mt-1 text-blue-500 flex-shrink-0" /><span>第三者への提供・開示は行いません。</span></li>
              <li className="flex items-start gap-2"><SolidIcon name="dot" className="w-3 h-3 mt-1 text-blue-500 flex-shrink-0" /><span>回答の日時と所要時間（ページを開いた時刻、問診にかかった時間など）も、お打ち合わせの準備のために記録します。</span></li>
            </ul>
          </div>
          <label className={`flex items-start gap-3 p-4 border-2 rounded-xl cursor-pointer transition mb-6 ${privacyAgreed ? 'bg-blue-50 border-blue-400' : 'bg-white border-gray-200 hover:border-blue-300'}`}>
            <input type="checkbox" checked={privacyAgreed} onChange={e => setPrivacyAgreed(e.target.checked)} className="w-5 h-5 mt-0.5 rounded border-gray-300 text-blue-600 cursor-pointer" />
            <span className="text-sm text-gray-800 leading-relaxed">上記の情報の取り扱いについて確認し、<span className="font-bold text-blue-700">個人情報および企業情報の取り扱いに同意</span>のうえ、{isExec ? '上層部問診' : '事前問診'}を開始します。</span>
          </label>
          <button disabled={!privacyAgreed} onClick={() => { setStarted(true); logEvent('start'); }}
            className={`btn-ripple w-full py-4 rounded-xl font-bold text-lg transition shadow-lg ${privacyAgreed ? (isExec ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white') : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
            {isExec ? '上層部問診を開始する' : '事前問診を開始する'}
          </button>
        </div>
      </div>
    );
  }
  
  const currentStepDef = steps[currentStep];
  const nextDisabled = !canProceed || navigating;
  // v3.7: いまの手順の問診で未回答の数（「送信する」の確認に使う）
  const quizStepId = steps[currentStep]?.id;
  const quizQs = quizStepId === 'staff' ? staffQuestions : quizStepId === 'executive' ? executiveQuestions : [];
  const quizAns = data[(quizStepId === 'executive' ? 'executive' : 'staff') + 'Answers'] || {};
  const quizUnanswered = quizQs.filter(q => !quizAns[q.id]).length;
  const isLastStep = currentStep >= steps.length - 1;
  const sizeLabel = ({ small:'100名以下', medium:'101〜300名', large:'301名以上' })[determinedSize] || '';
  const saveStatus = saving
    ? <span style={{ fontSize:12, color:'var(--sub)' }}>保存しています…</span>
    : savedAt
      ? <span style={{ display:'inline-flex', alignItems:'center', gap:6, fontSize:12, color:'var(--sub)' }}><span style={{ width:7, height:7, borderRadius:'50%', background:'var(--ok)' }} />保存しました {savedAt}</span>
      : null;
  // v3.4 画面の骨組み（案2）: 左に手順・右に入力。問診は1問ずつ（案3）
  return (
    <div className="pi-shell">
      <aside className="pi-side" aria-label="回答の手順">
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <span style={{ width:28, height:28, borderRadius:6, background:'var(--acc)', color:'#FFFFFF', display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:600 }}>G</span>
          <span style={{ fontSize:14, fontWeight:600 }}>採用ブラックボックス診断<sup style={{ fontSize:9 }}>®</sup></span>
        </div>
        <div style={{ padding:14, background:'var(--surfSub)', border:'1px solid var(--rule2)', borderRadius:8 }}>
          <div style={{ fontSize:12, color:'var(--sub)' }}>{isExec ? '上層部の方の問診' : '担当者の方の事前問診'}</div>
          <div className="mono" style={{ fontSize:13, marginTop:4 }}>No. {customerId}</div>
          {sizeLabel && <div style={{ fontSize:12, color:'var(--sub)', marginTop:4 }}>従業員 {sizeLabel}</div>}
        </div>
        <nav style={{ display:'flex', flexDirection:'column', gap:2 }}>
          {steps.map((st, i) => {
            const done = i < currentStep, cur = i === currentStep;
            return (
              <div key={st.id} aria-current={cur ? 'step' : undefined}
                style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 12px', borderRadius:8, background: cur ? 'var(--accSoft)' : 'transparent' }}>
                <span className="mono" style={{ width:22, height:22, borderRadius:'50%', display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize:12, flexShrink:0,
                  background: done ? 'var(--acc)' : cur ? 'var(--ink)' : 'var(--surf)', color: (done || cur) ? '#FFFFFF' : 'var(--sub)',
                  border: `1px solid ${done ? 'var(--acc)' : cur ? 'var(--ink)' : 'var(--line)'}` }}>{done ? '✓' : i + 1}</span>
                <span style={{ fontSize:14, fontWeight: cur ? 600 : 400, color: (done || cur) ? 'var(--ink)' : 'var(--sub)' }}>{st.label}</span>
                {done && <span style={{ marginLeft:'auto', fontSize:12, color:'var(--sub)' }}>済み</span>}
              </div>
            );
          })}
        </nav>
        <div style={{ marginTop:'auto', fontSize:12, color:'var(--sub)', lineHeight:1.8 }}>
          回答は次へ進むたび（問診は1問ごと）に保存されます。途中で閉じても、同じURLから続きを始められます。<br />
          ご不明点は、担当者までお問い合わせください。
        </div>
      </aside>
      <main className="pi-main">
        <div className="pi-top">
          <span style={{ fontSize:13, color:'var(--sub)' }}>手順 <span className="mono">{currentStep + 1} / {steps.length}</span></span>
          <span style={{ fontSize:13, color:'var(--ink)', fontWeight:600 }}>{currentStepDef?.label}</span>
          <span style={{ marginLeft:'auto' }}>{saveStatus}</span>
        </div>
        <div className="pi-mobile-steps" aria-hidden="true">
          {steps.map((st, i) => <span key={st.id} style={{ flex:1, height:3, borderRadius:2, background: i < currentStep ? 'var(--acc)' : i === currentStep ? 'var(--ink)' : 'var(--rule)' }} />)}
        </div>
        <div className="pi-body">
          {currentStepDef?.id === 'companySize' && <StepCompanySize data={data} onChange={d => setData(d)} />}
          {currentStepDef?.id === 'jobType' && <StepJobType data={data} onChange={d => setData(d)} />}
          {currentStepDef?.id === 'target' && <StepTarget data={data} onChange={d => setData(d)} />}
          {currentStepDef?.id === 'method' && <StepMethod data={data} onChange={d => setData(d)} methodMaster={methodMaster} />}
          {currentStepDef?.id === 'challenges' && <StepChallenges data={data} onChange={d => setData(d)} />}
          {currentStepDef?.id === 'staff' && <StepQuestionnaire data={data} onChange={d => setData(d)} roleKey="staff" questions={staffQuestions} title="担当者問診" onQuizActive={setQuizActive} onComplete={onQuizComplete} />}
          {currentStepDef?.id === 'executive' && <StepQuestionnaire data={data} onChange={d => setData(d)} roleKey="executive" questions={executiveQuestions} title="上層部問診" onQuizActive={setQuizActive} onComplete={onQuizComplete} />}
          {currentStepDef?.id === 'funnel' && <StepFunnel data={data} onChange={d => setData(d)} methodMaster={methodMaster} />}
          {!quizActive && (
            askSubmit ? (
              /* v3.7: 未回答のまま送信する前の確認 */
              <div style={{ display:'flex', flexDirection:'column', gap:12, marginTop:24, paddingTop:20, borderTop:'1px solid var(--rule)' }}>
                <p style={{ margin:0, fontSize:16, fontWeight:600 }}>問診が {quizUnanswered}問 未回答です（全{quizQs.length}問）。このまま送信しますか？</p>
                <p style={{ margin:0, fontSize:13, color:'var(--sub)' }}>答えられない問いは飛ばして構いません。送信した後も、担当者が受け取るまでは同じURLから見直せます。</p>
                <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
                  <button type="button" className="pi-btn" onClick={() => setAskSubmit(false)}>問診に戻る</button>
                  <button type="button" className="pi-btn primary" onClick={goNext} disabled={navigating}>{navigating ? '送信しています…' : 'このまま送信する'}</button>
                </div>
              </div>
            ) :
            <div style={{ display:'flex', alignItems:'center', gap:12, marginTop:24, paddingTop:20, borderTop:'1px solid var(--rule)' }}>
              <button type="button" className="pi-btn" onClick={goPrev} disabled={currentStep === 0 || navigating}>戻る</button>
              {!canProceed && <span style={{ fontSize:13, color:'var(--sub)' }}>この手順の入力が済むと進めます</span>}
              <button type="button" className="pi-btn primary" onClick={goNext} disabled={nextDisabled} style={{ marginLeft:'auto' }}>
                {navigating ? (isLastStep ? '送信しています…' : '保存しています…') : isLastStep ? '送信する' : `次へ　${steps[currentStep + 1]?.label || ''}`}
              </button>
            </div>
          )}
        </div>
      </main>
    </div>
  );
};


ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><App /></ToastProvider>);
</script>
</body>
</html>
